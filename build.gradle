plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id "me.modmuss50.mod-publish-plugin" version "1.1.0"
    id 'maven-publish'
}

version = project.mod_version + "+" + project.minecraft_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url "https://maven.nucleoid.xyz/" }
}

sourceSets {
    testMod {
        runtimeClasspath += main.runtimeClasspath
        compileClasspath += main.compileClasspath
    }
}

loom {
    runs {
        testModClient {
            client()
            name = "Test Mod Client"
            source sourceSets.testMod
        }

        testModServer {
            server()
            name = "Test Mod Server"
            source sourceSets.testMod
        }
    }

    runConfigs.all {
        ideConfigGenerated(true)
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    compileOnly "eu.pb4:placeholder-api:${project.placeholder_api_version}"

    compileOnly "net.kyori:adventure-text-serializer-gson:${project.adventure_version}"

    // testmod
    testModImplementation sourceSets.main.output
    testModImplementation "eu.pb4:placeholder-api:${project.placeholder_api_version}"
    testModImplementation fabricApi.module("fabric-command-api-v2", project.fabric_version)
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

stonecutter {
    replacements.string(eval(current.version, "<=1.21.10")) {
        replace("Identifier", "ResourceLocation")
    }
}

publishMods {
    file = jar.archiveFile
//    additionalFiles.from(tasks.named("sourcesJar"))
    type = STABLE
    displayName = "message-api ${version.get()}"
    changelog = ""

    modLoaders.add("fabric")
    modLoaders.add("quilt")

    modrinth {
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        projectId = "BJEC0JAD"
        minecraftVersions.add(project.minecraft_version)
    }

    github {
        accessToken = providers.environmentVariable("GITHUB_TOKEN")
        repository = providers.environmentVariable("GITHUB_REPOSITORY").getOrElse("DrexHD/message-api")
        commitish = providers.environmentVariable("GITHUB_REF_NAME").getOrElse("main")
    }
}

java {
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}

// configure the maven publication
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
